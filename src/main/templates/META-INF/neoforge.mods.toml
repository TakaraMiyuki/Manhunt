license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

# The authors of the mod, displayed in the mod UI
authors="${mod_authors}"
description='''
猎人游戏（Manhunt）：猎人与逃生者对抗玩法。逃生者依次激活四个检查点并击杀末影龙获胜，猎人负责追杀。
(Manhunt: runners activate four checkpoints and slay the Ender Dragon while hunters hunt them down.)
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 技能卡模组（可选）：同时安装时检查点可抽技能卡。
# 注意 ordering 必须为 NONE——SkillCards 侧已声明 AFTER manhunt，双方 AFTER 会构成依赖环
[[dependencies.${mod_id}]]
    modId="skillcards"
    type="optional"
    versionRange="[0.2.0-beta,)"
    ordering="NONE"
    side="BOTH"

# Curios（可选）：被动卡饰品栏（skill_passive 槽位由本模组数据包注册）
[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    versionRange="[16.0.0,)"
    ordering="NONE"
    side="BOTH"
